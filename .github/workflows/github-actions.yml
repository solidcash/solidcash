name: tests

on:
  push:
    branches:
      - 'master'
      - 'solidcash_v*'

  pull_request:
    branches:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # single job for testing, linting and spellcheck
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        # Workspace prepare/postinstall hooks build the monorepo, but the next step performs the authoritative
        # project-reference build. Skip lifecycle scripts here to avoid compiling every package twice.
        run: yarn --frozen-lockfile --ignore-scripts

      - name: Build packages and testing suite
        run: yarn build

      - name: Reject source-tree TypeScript outputs
        run: yarn check:source-tree

      - name: Reject citations to missing Markdown docs
        run: yarn check:doc-citations

      - name: Run tests
        # Default yarn test is unit/fast packages (solidcash excludes e2e). Keep mocknet e2e in CI.
        run: yarn test -- -- --coverage --coverage.provider=v8

      - name: Run solidcash e2e (mocknet)
        run: yarn test:e2e

      - name: Run release application conformance gate
        run: yarn test:application-conformance

      - name: Start BCHN v29 release-smoke services
        run: docker compose -f docker-compose.regtest.yml up -d --wait --wait-timeout 120 bchn fulcrum

      - name: Run BCHN v29 release application smoke
        run: yarn test:application-regtest

      - name: Stop BCHN v29 release-smoke services
        if: always()
        run: docker compose -f docker-compose.regtest.yml down -v

      - name: Run generated-project smoke gate
        run: yarn test:generated-project-smoke

      - name: Run release security conformance gate
        run: yarn test:security-conformance

      - name: Run linter
        run: yarn lint

      - name: Run spellchecker
        run: yarn spellcheck

      - name: Run maintained examples
        run: yarn examples

      - name: Compile the public docs snippets
        run: yarn test:docs-snippets

      - name: Verify the reviewed Solidity corpus baseline
        run: yarn test:corpus-baseline

      - name: Test packed release packages in a clean consumer
        run: yarn test:package-smoke

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: solidcash/solidcash
