<svg viewBox="0 0 480 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06f885"/>
      <stop offset="100%" stop-color="#00b35f"/>
    </linearGradient>
  </defs>

  <!-- Icon: Faceted hexagonal gem with $ -->
  <g transform="translate(5, 5)">
    <g transform="scale(0.9)">
      <polygon points="50,2 93,27 93,73 50,98 7,73 7,27" fill="url(#gem)"/>
      <polygon points="50,2 7,27 50,50" fill="#06f885" opacity="0.65"/>
      <polygon points="50,2 93,27 50,50" fill="#00e070" opacity="0.80"/>
      <polygon points="7,27 7,73 50,50" fill="#00c462" opacity="0.50"/>
      <polygon points="93,27 93,73 50,50" fill="#06f885" opacity="0.42"/>
      <polygon points="7,73 50,98 50,50" fill="#00a653" opacity="0.62"/>
      <polygon points="93,73 50,98 50,50" fill="#008f47" opacity="0.75"/>
      <g fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
        <line x1="50" y1="22" x2="50" y2="78"/>
        <path d="M62,36 C62,28 56,24 50,24 C44,24 38,28 38,36 C38,42 44,45 50,46"/>
        <path d="M38,64 C38,72 44,76 50,76 C56,76 62,72 62,64 C62,58 56,55 50,54"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="105" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">
    <tspan fill="white">Solid</tspan><tspan fill="#06f885">Cash</tspan>
  </text>
</svg>
